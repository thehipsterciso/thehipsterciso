<svg xmlns="http://www.w3.org/2000/svg" width="680" height="188" viewBox="0 0 680 188" role="img" aria-label="A claims confidence decays as its evidence ages crossing a re-verify threshold"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.t{fill:#1f2328}.ts{fill:#59636e;font-size:13px}.tt{fill:#818b98;font-size:12px}
.big{fill:#1f2328;font-weight:600}.lbl{fill:#1f2328;font-size:13px}
.div{stroke:#d0d7de}
@media (prefers-color-scheme:dark){.t,.big,.lbl{fill:#e6edf3}.ts{fill:#9198a1}.tt{fill:#6e7681}.div{stroke:#30363d}}
</style>
<text class="ts" x="40" y="40">Confidence in a claim, as its evidence ages</text>
<text class="tt" x="40" y="86">high</text>
<text class="tt" x="40" y="150">low</text>
<line class="div" x1="78" y1="64" x2="78" y2="158" stroke-width="1"/>
<line class="div" x1="78" y1="158" x2="610" y2="158" stroke-width="1"/>
<line x1="92" y1="124" x2="600" y2="124" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>
<text class="tt" x="600" y="120" text-anchor="end" fill="#D85A30">re-verify threshold</text>
<path d="M92 80 C 220 82, 300 96, 372 118 S 520 150, 600 152" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
<circle cx="372" cy="118" r="4" fill="#D85A30"/>
<text class="ts" x="372" y="108" text-anchor="middle">re-verify</text>
<text class="ts" x="324" y="178">evidence ages &#8594;</text>
<text class="tt" x="600" y="178" text-anchor="end">illustrative</text>
</svg>